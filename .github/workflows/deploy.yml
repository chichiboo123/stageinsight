name: Deploy to GitHub Pages

# ⚠ 이 프로젝트는 Netlify를 주력 호스팅으로 사용합니다.
#   GitHub Pages는 정적 호스팅이라 /api/* 프록시(KOPIS·네이버)와 AI 서버리스 함수를
#   실행할 수 없어, 자동 배포 시 자산 404·기능 미동작을 일으킵니다.
#   따라서 자동 트리거(push)를 제거하고 수동 실행(workflow_dispatch)만 남겨 둡니다.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
          VITE_KAKAO_JS_API_KEY: ${{ secrets.VITE_KAKAO_JS_API_KEY }}
          VITE_KOPIS_KEY: ${{ secrets.VITE_KOPIS_KEY }}
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
          VITE_NAVER_CLIENT_SECRET: ${{ secrets.VITE_NAVER_CLIENT_SECRET }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
