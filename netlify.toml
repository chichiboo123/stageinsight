[build]
  command = "npm run build"
  publish = "dist"
  base = "."

[context.production]
  branch = "main"

[functions]
  # AI 게이트웨이 함수는 자기완결형(netlify/functions/_*.mjs)으로 번들된다.
  node_bundler = "esbuild"

# AI 게이트웨이: /api/ai/<handler> → 서버리스 함수 (GEMINI_API_KEY는 서버 전용)
[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/ai/:splat"
  status = 200
  force = true

# KOPIS API CORS 우회 프록시
[[redirects]]
  from = "/api/kopis/*"
  to = "http://www.kopis.or.kr/openApi/restful/:splat"
  status = 200
  force = true

# Naver Books API CORS 우회 프록시
[[redirects]]
  from = "/api/naver/*"
  to = "https://openapi.naver.com/:splat"
  status = 200
  force = true

# 인사이트 바구니 공유 단축 링크 (Netlify Blobs 저장)
[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share"
  status = 200
  force = true

# React SPA 새로고침 폴백
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
